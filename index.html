<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/title-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./src/style.css" />

    <title>Spotify</title>
  </head>
  <body class="bg-black font-['Public_Sans'] min-h-screen h-screen overflow-hidden">

    <header id="header" class="z-40"></header>

    
    <div
      class="spotify-home grid grid-cols-1 md:grid-cols-[0.4fr_1.2fr] gap-2 
             h-[calc(100vh-72px)] md:h-[calc(100vh-110px)] p-3 overflow-hidden w-full"
    >
      <aside id="sidebar" class="hidden  md:block"></aside>
<div id="offcanvas-sidebar"
     class="fixed inset-y-0 left-0 w-72 bg-[#0f0f0f]  z-50 transform -translate-x-full opacity-0 transition-all duration-300 md:hidden">
  <div class="flex items-center justify-between p-4 border-b border-neutral-800">
    <h2 class="text-white font-bold text-lg">Menu</h2>
    <button id="offcanvas-close" class="p-2 rounded-full hover:bg-white/5">
      <img src="/svg/clearbtn.svg" alt="">
    </button>
  </div>
  <div id="mobile-sidebar-placeholder" class="p-3 overflow-y-auto h-full"></div>
</div>


      <main id="playlists" class="min-h-0 overflow-hidden"></main>
    </div>

    <div id="player"></div>

    <script src="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
