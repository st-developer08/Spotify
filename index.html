<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icons/title-icon.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Simplebar -->
    <link
      href="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.css"
      rel="stylesheet"
    />
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <!-- Custom styles -->
    <link rel="stylesheet" href="./src/style.css" />

    <title>Spotify</title>
  </head>
  <body class="bg-black font-['Public_Sans'] h-screen overflow-hidden p-1">
    
    
   
    <header id="header"></header>
    
    <div
      class="spotify-home grid grid-cols-[0.4fr_1.2fr] mt-[-8px] gap-2 h-full p-3 overflow-hidden"
    >
      <!-- Sidebar -->
      <aside id="sidebar" ></aside>

      <!-- Main content -->
      <main id="playlists" ></main>
    </div>

    <!-- Player -->
    <div id="player">
      
    </div>

    <script src="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
